<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>Wrapper scroll lock fixture</title>
	<style>
		body {
			margin: 0;
			/* the lock is NOT on body/html: the site freezes its page wrapper
			   instead, like SPAs with #app / #__next containers do */
		}
		#shell {
			height: 100vh;
			overflow: hidden;
		}
		main {
			height: 3000px;
			padding: 16px;
		}
		#overlay {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: rgba(0, 0, 0, 0.6);
			z-index: 9999;
		}
		#overlay .dialog {
			background: #fff;
			width: 400px;
			margin: 20vh auto 0;
			padding: 24px;
		}
	</style>
</head>
<body>
	<div id="shell">
		<main>
			<h1>Article headline</h1>
			<p>The actual page content readers came for.</p>
		</main>
	</div>

	<div id="overlay">
		<div class="dialog">
			<h2>We value your privacy</h2>
			<p>This site uses cookies. Please accept our cookie policy.</p>
			<button>Accept all</button>
		</div>
	</div>
</body>
</html>
