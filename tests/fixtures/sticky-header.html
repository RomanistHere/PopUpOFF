<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>Sticky header fixture</title>
	<style>
		body {
			margin: 0;
		}
		/* a legitimate site header: full width, modest height, stuck to the top.
		   Moderate mode must keep it, aggressive mode removes it. */
		header {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 60px;
			background: #333;
			color: #fff;
			line-height: 60px;
		}
		main {
			padding-top: 80px;
			height: 2000px;
		}
	</style>
</head>
<body>
	<header id="site-header">
		<nav>Home — Articles — Archive — Contact</nav>
	</header>
	<main>
		<h1>Article headline</h1>
		<p>The actual page content readers came for.</p>
	</main>
</body>
</html>
